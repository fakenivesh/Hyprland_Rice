# Set wallpaper for a specific monitor
wallpaper {
    monitor = eDP-1
    path = ~/.config/hypr/themes/themes/pokemon_lifegreen_end/wallpaper/pokemon.jpg
    fit_mode = cover
}

# Fallback wallpaper for any monitor not explicitly listed above
wallpaper {
    monitor =
    path = ~/Pictures/fallback.jpg
    fit_mode = cover
}

# Optional global settings (must be placed outside wallpaper blocks)
splash = false
ipc = true

